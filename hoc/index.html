<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123A5F">
<title>Khu học viên | Chị Hạnh Global</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="demo" class="demo-note" hidden>Đang ở chế độ xem thử với dữ liệu mẫu. Chưa kết nối tài khoản học viên thật.</div>
<header>
  <div class="wrap bar">
    <a class="brand" href="https://ngochanhvan.com/"><span class="logo" aria-hidden="true">S</span><span><strong>CHỊ HẠNH GLOBAL</strong><small>Khu học viên</small></span></a>
    <div class="who" id="who" hidden><span id="email"></span><button class="link" id="out">Đăng xuất</button></div>
  </div>
</header>

<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  const app = document.getElementById("app");
  if (HOC.demo) document.getElementById("demo").hidden = false;

  if (!HOC.demo && !HOC.configured) {
    app.innerHTML = `<div class="gate"><div class="gate-card">
      <h1>Khu học viên đang được thiết lập</h1>
      <p>Hệ thống chưa được kết nối. Xem giao diện mẫu trong lúc chờ.</p>
      <a class="btn" href="?demo=1">Xem thử giao diện</a></div></div>`;
    return;
  }

  const user = await HOC.user();
  if (!user) {
    app.innerHTML = `<div class="gate"><div class="gate-card">
      <h1>Đăng nhập khu học viên</h1>
      <p>Dùng đúng Gmail chị đã đăng ký khóa học để vào lớp.</p>
      <button class="btn" id="in"><span class="g-ico"><svg width="12" height="12" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg></span>Tiếp tục với Google</button>
      <p class="fine">Dùng email khác thì hệ thống chưa mở lớp được.</p></div></div>`;
    document.getElementById("in").onclick = HOC.signIn;
    return;
  }

  document.getElementById("who").hidden = false;
  document.getElementById("email").textContent = user.email;
  document.getElementById("out").onclick = HOC.signOut;

  const courses = await HOC.myCourses();
  if (!courses.length && HOC.loadError) {
    app.innerHTML = `<div class="wrap page"><h1>Chưa tải được khóa học</h1>
      <div class="empty"><b>Hệ thống đang gặp lỗi, không phải do tài khoản của bạn.</b>
      <p>Mã lỗi: ${HOC.esc(HOC.loadError)}</p></div></div>`;
    return;
  }
  if (!courses.length) {
    app.innerHTML = `<div class="wrap page"><h1>Khóa học của bạn</h1>
      <div class="empty"><b>Email ${HOC.esc(user.email)} chưa được mở khóa học nào.</b>
      <p>Nếu bạn đã đăng ký, có thể bạn dùng một Gmail khác lúc đăng ký. Nhắn trợ lý để được mở lớp.</p>
      ${HOC.zalo ? `<a class="btn o" href="${HOC.esc(HOC.zalo)}" target="_blank" rel="noopener">Nhắn trợ lý qua Zalo</a>` : ""}
      </div></div>`;
    return;
  }

  // Tính tiến độ từng khóa
  const cards = [];
  for (const c of courses) {
    const ls = await HOC.lessons(c.slug);
    const pr = await HOC.progress(ls.map((l) => l.id));
    const done = ls.filter((l) => pr[l.id] && pr[l.id].completed).length;
    const next = ls.find((l) => !(pr[l.id] && pr[l.id].completed)) || ls[0];
    const pct = ls.length ? Math.round((done / ls.length) * 100) : 0;
    cards.push(`<a class="course" href="${HOC.link(`bai.html?khoa=${encodeURIComponent(c.slug)}${next ? `&bai=${next.position}` : ""}`)}">
      <h2>${HOC.esc(c.title)}</h2>
      ${c.subtitle ? `<p>${HOC.esc(c.subtitle)}</p>` : ""}
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="stat">Hoàn thành ${done}/${ls.length} bài</div>
      <div class="go">${done ? "Học tiếp" : "Bắt đầu học"}${next ? `: ${HOC.esc(next.title)}` : ""} →</div>
    </a>`);
  }
  const name = (user.user_metadata && user.user_metadata.full_name) || "";
  app.innerHTML = `<div class="wrap page"><h1>Chào ${HOC.esc(name || "bạn")}</h1>
    <p class="lead">Khóa học của bạn. Học tới đâu, hệ thống nhớ tới đó.</p>
    <div class="grid">${cards.join("")}</div></div>`;
})();
</script>
</body>
</html>
